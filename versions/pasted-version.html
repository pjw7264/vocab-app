<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>단계별 완벽 영단어 정복</title>
    <style>
        :root {
            --primary: #6C5CE7;
            --secondary: #A29BFE;
            --success: #00B894;
            --danger: #FF7675;
            --warning: #FDCB6E;
            --bg: #1E1E2E;
            --card-bg: #2D2D44;
            --text: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
        }

        .game-container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            padding: 20px 16px;
            border-radius: 24px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.4);
            text-align: center;
            border: 2px solid #3F3F5F;
            position: relative;
        }

        /* 단계 내비게이션 */
        .step-nav {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .step-btn {
            flex: 1 1 45%;
            padding: 8px 4px;
            font-size: 0.8rem;
            font-weight: bold;
            border: 1px solid var(--secondary);
            background: transparent;
            color: var(--secondary);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .step-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* 공통 카드 */
        .card {
            background: #383854;
            border: 2px solid #4E4E73;
            border-radius: 18px;
            padding: 20px 12px;
            margin-bottom: 16px;
            position: relative;
        }

        .word-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: #FFFFFF;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .clickable-word {
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .clickable-word:active {
            background: rgba(255, 255, 255, 0.1);
        }

        .sound-btn {
            background: var(--primary);
            border: none;
            color: white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 1.5rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 10px auto;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.4);
        }

        .sound-btn:active {
            transform: scale(0.95);
        }

        .pronun-text {
            font-size: 1.2rem;
            color: var(--warning);
            font-weight: bold;
            margin-top: 6px;
        }

        .mean-text {
            font-size: 1.3rem;
            color: var(--success);
            font-weight: bold;
            margin-top: 12px;
            min-height: 1.5em;
        }

        .mean-placeholder {
            font-size: 0.95rem;
            color: #A0A0C0;
            font-weight: normal;
        }

        /* 버튼 및 입력 */
        .btn-group {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            flex: 1;
            padding: 14px;
            font-size: 0.95rem;
            font-weight: bold;
            color: white;
            background: var(--primary);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.3);
            margin-top: 8px;
        }

        .action-btn:disabled {
            background: #4E4E73;
            cursor: not-allowed;
            box-shadow: none;
            opacity: 0.5;
        }

        .action-btn.secondary-btn {
            background: #4A4A6A;
        }

        .action-btn.retry {
            background: #E17055;
        }

        .choice-btn {
            width: 100%;
            padding: 12px;
            margin-bottom: 8px;
            background: #222235;
            border: 2px solid #4E4E73;
            color: white;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            text-align: left;
        }

        .choice-btn:active {
            border-color: var(--primary);
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px;
            font-size: 1rem;
            border: 2px solid #4E4E73;
            border-radius: 12px;
            background: #222235;
            color: white;
            outline: none;
            text-align: center;
        }

        /* 타이머 바 */
        .timer-container {
            width: 100%;
            height: 8px;
            background: #222235;
            border-radius: 4px;
            margin-bottom: 16px;
            overflow: hidden;
        }

        .timer-bar {
            height: 100%;
            width: 100%;
            background: var(--success);
            transition: width 0.1s linear;
        }

        /* 짝맞추기 카드 */
        .match-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 16px;
        }

        .match-card {
            background: #383854;
            border: 2px solid #4E4E73;
            border-radius: 12px;
            padding: 12px 6px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60px;
            font-size: 0.85rem;
            text-align: center;
        }

        .match-card .card-sub {
            font-size: 0.75rem;
            color: var(--warning);
            margin-top: 4px;
        }

        .match-card.selected {
            border-color: var(--warning);
            background: #444466;
        }

        .match-card.matched {
            visibility: hidden;
        }

        .screen { display: none; }
        .screen.active { display: block; }

        .result-msg {
            font-size: 1rem;
            font-weight: bold;
            min-height: 24px;
            margin-bottom: 8px;
        }
        .correct { color: var(--success); }
        .wrong { color: var(--danger); }
    </style>
</head>
<body>

<div class="game-container">
    <!-- 네비게이션 버튼 -->
    <div class="step-nav">
        <button class="step-btn active" id="nav-1-1" onclick="changeStep('1-1')">1-1. 발음보고 뜻 보기</button>
        <button class="step-btn" id="nav-1-2" onclick="changeStep('1-2')">1-2. 듣고 뜻 맞추기</button>
        <button class="step-btn" id="nav-2-1" onclick="changeStep('2-1')">2-1. 타이핑 테스트</button>
        <button class="step-btn" id="nav-2-2" onclick="changeStep('2-2')">2-2. 짝 맞추기</button>
    </div>

    <!-- [1-1] 발음 보고 뜻 보기 -->
    <div id="screen-1-1" class="screen active">
        <div style="margin-bottom:10px; font-weight:bold; color:var(--secondary);" id="s11-progress">진행도: 1 / 20</div>
        <div class="card">
            <div class="word-title">
                <span id="s11-word" class="clickable-word" onclick="revealMeaning1_1()">Word</span>
            </div>
            <div class="pronun-text" id="s11-pronun">[ 발음 ]</div>
            <hr style="border-color: #4E4E73; margin: 16px 0;">
            <div class="mean-text" id="s11-mean"></div>
        </div>
        <div class="btn-group">
            <button class="action-btn secondary-btn" id="s11-prev-btn" onclick="prev1_1()">⬅️ 이전 단어</button>
            <button class="action-btn" onclick="next1_1()">다음 단어 ➡️</button>
        </div>
    </div>

    <!-- [1-2] 듣고 뜻 맞추기 (실제 발음 음성) -->
    <div id="screen-1-2" class="screen">
        <div style="margin-bottom:10px;" id="s12-progress">진행도: 1/20</div>
        <div class="card">
            <div style="color:var(--secondary); font-size:0.9rem; margin-bottom: 6px;">소리를 듣고 정답을 고르세요</div>
            <button class="sound-btn" onclick="speakCurrentWord()">🔊</button>
            <div class="pronun-text" id="s12-pronun">[한글 발음]</div>
        </div>
        <div id="s12-choices"></div>
        <div class="result-msg" id="s12-msg"></div>
    </div>

    <!-- [2-1] 단어 및 발음 보고 뜻 타이핑 -->
    <div id="screen-2-1" class="screen">
        <div style="margin-bottom:10px;" id="s21-progress">진행도: 1/20</div>
        <div class="timer-container"><div class="timer-bar" id="s21-timer"></div></div>
        <div class="card">
            <div class="word-title"><span id="s21-word">Word</span></div>
            <div class="pronun-text" id="s21-pronun">[ 발음 ]</div>
        </div>
        <div class="input-group">
            <input type="text" id="s21-input" placeholder="뜻을 입력하세요" autocomplete="off">
            <button class="action-btn" style="width:80px; margin-top:0;" onclick="submitTyping()">제출</button>
        </div>
        <div class="result-msg" id="s21-msg"></div>
    </div>

    <!-- [2-2] 짝 맞추기 -->
    <div id="screen-2-2" class="screen">
        <div style="margin-bottom:10px;" id="s22-progress">단계 진행 중</div>
        <div class="timer-container"><div class="timer-bar" id="s22-timer"></div></div>
        <div class="match-grid" id="s22-grid"></div>
        <div class="result-msg" id="s22-msg"></div>
    </div>

    <!-- [결과 및 오답노트] -->
    <div id="screen-result" class="screen">
        <h2 id="res-title">🎉 단계 완료!</h2>
        <p id="res-desc" style="margin: 20px 0; font-size: 1.1rem;"></p>
        <div id="res-buttons"></div>
    </div>
</div>

<script>
    // 업로드해주신 사진 속 20개 단어 및 한글 발음/뜻 데이터 (순서 고정)
    const rawVocabulary = [
        // 왼쪽 열
        { word: "attendee", pronun: "어텐디", mean: "참석자" },
        { word: "support", pronun: "서포트", mean: "지지, 지원" },
        { word: "fee", pronun: "피", mean: "수수료, 요금" },
        { word: "conclusion", pronun: "컨클루전", mean: "결론" },
        { word: "decision", pronun: "디시전", mean: "결정, 판단" },
        { word: "permission", pronun: "퍼미션", mean: "허락, 허가" },
        { word: "expertise", pronun: "엑스퍼티즈", mean: "전문 지식" },
        { word: "failure", pronun: "페일리어", mean: "실패, 고장" },
        { word: "solution", pronun: "솔루션", mean: "해결" },
        { word: "advancement", pronun: "어드밴스먼트", mean: "진보, 발전" },

        // 오른쪽 열
        { word: "site", pronun: "사이트", mean: "현장, 장소" },
        { word: "material", pronun: "머티리얼", mean: "재료, 자료" },
        { word: "matter", pronun: "매터", mean: "문제, 상황" },
        { word: "exception", pronun: "익셉션", mean: "예외, 제외" },
        { word: "profit", pronun: "프라핏", mean: "이익, 이윤" },
        { word: "standard", pronun: "스탠다드", mean: "표준, 수준" },
        { word: "priority", pronun: "프라이오리티", mean: "우선순위" },
        { word: "distribution", pronun: "디스트리뷰션", mean: "배분, 배포" },
        { word: "possibility", pronun: "파서빌리티", mean: "가능성" },
        { word: "repetition", pronun: "레퍼티션", mean: "반복" }
    ];

    let currentStep = '1-1';
    let currentList = [];
    let wrongList = [];
    let currentIndex = 0;
    let timerInterval = null;

    // TTS 오디오 발음 재생 함수
    function speakWord(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            window.speechSynthesis.speak(utterance);
        }
    }

    function speakCurrentWord() {
        if (currentList[currentIndex]) {
            speakWord(currentList[currentIndex].word);
        }
    }

    function shuffle(arr) {
        return [...arr].sort(() => Math.random() - 0.5);
    }

    function checkAnswer(userInput, targetMean) {
        if (!userInput) return false;
        const cleanUser = userInput.replace(/\s+/g, '').toLowerCase();
        const targets = targetMean.split(/[,;/]/).map(s => s.replace(/\(.*?\)/g, '').replace(/\s+/g, '').toLowerCase());
        return targets.some(target => target.length > 0 && (cleanUser.includes(target) || target.includes(cleanUser)));
    }

    function changeStep(step, isRetry = false) {
        currentStep = step;
        clearInterval(timerInterval);

        document.querySelectorAll('.step-btn').forEach(b => b.classList.remove('active'));
        const navBtn = document.getElementById(`nav-${step}`);
        if(navBtn) navBtn.classList.add('active');

        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));

        if (!isRetry) {
            // 1-1, 2-1(타이핑 테스트) 모드는 원본 순서 고정, 1-2 및 2-2는 무작위
            currentList = (step === '1-1' || step === '2-1') ? [...rawVocabulary] : shuffle(rawVocabulary);
        }
        wrongList = [];
        currentIndex = 0;

        if (step === '1-1') init1_1();
        else if (step === '1-2') init1_2();
        else if (step === '2-1') init2_1();
        else if (step === '2-2') init2_2();
    }

    /* ----------------------------------------------------
       [1-1] 발음보고 뜻 보기
    ---------------------------------------------------- */
    function init1_1() {
        document.getElementById('screen-1-1').classList.add('active');
        show1_1();
    }

    function show1_1() {
        if (currentIndex >= currentList.length) {
            showResult("1-1 단계 완료!", "모든 단어의 발음과 뜻을 확인하셨습니다.");
            return;
        }

        document.getElementById('s11-progress').textContent = `단어 번호: ${currentIndex + 1} / ${currentList.length}`;

        const item = currentList[currentIndex];
        document.getElementById('s11-word').textContent = item.word;
        document.getElementById('s11-pronun').textContent = `[ ${item.pronun} ]`;

        const meanElement = document.getElementById('s11-mean');
        meanElement.innerHTML = `<span class="mean-placeholder">[ 👆 단어를 누르면 뜻이 보입니다 ]</span>`;

        document.getElementById('s11-prev-btn').disabled = (currentIndex === 0);
    }

    function revealMeaning1_1() {
        if (currentList[currentIndex]) {
            document.getElementById('s11-mean').textContent = currentList[currentIndex].mean;
        }
    }

    function next1_1() {
        currentIndex++;
        show1_1();
    }

    function prev1_1() {
        if (currentIndex > 0) {
            currentIndex--;
            show1_1();
        }
    }

    /* ----------------------------------------------------
       [1-2] 듣고 뜻 맞추기 (실제 발음 음성 재생)
    ---------------------------------------------------- */
    function init1_2() {
        document.getElementById('screen-1-2').classList.add('active');
        show1_2();
    }

    function show1_2() {
        if (currentIndex >= currentList.length) {
            showStepResult();
            return;
        }
        const item = currentList[currentIndex];
        document.getElementById('s12-progress').textContent = `진행도: ${currentIndex + 1} / ${currentList.length}`;
        document.getElementById('s12-pronun').textContent = `[ ${item.pronun} ]`;
        document.getElementById('s12-msg').textContent = '';

        // 원어민 발음 자동 재생
        speakWord(item.word);

        let choices = [item];
        let others = rawVocabulary.filter(v => v.word !== item.word);
        choices = choices.concat(shuffle(others).slice(0, 3));
        choices = shuffle(choices);

        const choicesDiv = document.getElementById('s12-choices');
        choicesDiv.innerHTML = '';
        choices.forEach(c => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.textContent = c.mean;
            btn.onclick = () => select1_2(c, item);
            choicesDiv.appendChild(btn);
        });
    }

    function select1_2(selected, correct) {
        const msg = document.getElementById('s12-msg');
        if (selected.word === correct.word) {
            msg.className = 'result-msg correct';
            msg.textContent = '⭕ 정답입니다!';
        } else {
            msg.className = 'result-msg wrong';
            msg.textContent = `❌ 오답! (단어: ${correct.word} / 뜻: ${correct.mean})`;
            wrongList.push(correct);
        }

        setTimeout(() => {
            currentIndex++;
            show1_2();
        }, 1200);
    }

    /* ----------------------------------------------------
       [2-1] 타이핑 테스트 (순서대로 진행)
    ---------------------------------------------------- */
    function init2_1() {
        document.getElementById('screen-2-1').classList.add('active');
        show2_1();
    }

    function show2_1() {
        if (currentIndex >= currentList.length) {
            showStepResult();
            return;
        }
        const item = currentList[currentIndex];
        document.getElementById('s21-progress').textContent = `진행도: ${currentIndex + 1} / ${currentList.length}`;
        document.getElementById('s21-word').textContent = item.word;
        document.getElementById('s21-pronun').textContent = `[ ${item.pronun} ]`;
        document.getElementById('s21-input').value = '';
        document.getElementById('s21-msg').textContent = '';

        startTimer(10, () => {
            document.getElementById('s21-msg').className = 'result-msg wrong';
            document.getElementById('s21-msg').textContent = `⏰ 시간초과! (정답: ${item.mean})`;
            wrongList.push(item);
            setTimeout(() => { currentIndex++; show2_1(); }, 1200);
        });
    }

    function submitTyping() {
        clearInterval(timerInterval);
        const item = currentList[currentIndex];
        const val = document.getElementById('s21-input').value;
        const msg = document.getElementById('s21-msg');

        if (checkAnswer(val, item.mean)) {
            msg.className = 'result-msg correct';
            msg.textContent = '⭕ 정답입니다!';
        } else {
            msg.className = 'result-msg wrong';
            msg.textContent = `❌ 오답! (정답: ${item.mean})`;
            wrongList.push(item);
        }

        setTimeout(() => {
            currentIndex++;
            show2_1();
        }, 1200);
    }

    document.getElementById('s21-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') submitTyping();
    });

    /* ----------------------------------------------------
       [2-2] 짝 맞추기
    ---------------------------------------------------- */
    let selectedMatchCards = [];
    let matchedCount = 0;
    let stageList = [];

    function init2_2() {
        document.getElementById('screen-2-2').classList.add('active');
        show2_2();
    }

    function show2_2() {
        if (currentIndex >= currentList.length) {
            showStepResult();
            return;
        }

        stageList = currentList.slice(currentIndex, currentIndex + 5);
        document.getElementById('s22-progress').textContent = `남은 단어: ${currentList.length - currentIndex}개`;
        document.getElementById('s22-msg').textContent = '';

        let cardsData = [];
        stageList.forEach((item, idx) => {
            cardsData.push({ id: idx, type: 'word', text: item.word, subText: item.pronun, item });
            cardsData.push({ id: idx, type: 'mean', text: item.mean, subText: '', item });
        });
        cardsData = shuffle(cardsData);

        const grid = document.getElementById('s22-grid');
        grid.innerHTML = '';
        selectedMatchCards = [];
        matchedCount = 0;

        cardsData.forEach(c => {
            const el = document.createElement('div');
            el.className = 'match-card';

            let htmlContent = `<div>${c.text}</div>`;
            if (c.subText) {
                htmlContent += `<div class="card-sub">[${c.subText}]</div>`;
            }
            el.innerHTML = htmlContent;

            el.onclick = () => selectMatch(el, c);
            grid.appendChild(el);
        });

        startTimer(20, () => {
            document.getElementById('s22-msg').className = 'result-msg wrong';
            document.getElementById('s22-msg').textContent = '⏰ 시간초과! 스테이지의 단어가 오답 처리됩니다.';
            stageList.forEach(item => wrongList.push(item));
            setTimeout(() => {
                currentIndex += 5;
                show2_2();
            }, 1500);
        });
    }

    function selectMatch(el, data) {
        if (el.classList.contains('selected') || el.classList.contains('matched')) return;

        el.classList.add('selected');
        selectedMatchCards.push({ el, data });

        if (selectedMatchCards.length === 2) {
            const [c1, c2] = selectedMatchCards;
            if (c1.data.type !== c2.data.type && c1.data.id === c2.data.id) {
                c1.el.classList.add('matched');
                c2.el.classList.add('matched');
                selectedMatchCards = [];
                matchedCount++;

                if (matchedCount === stageList.length) {
                    clearInterval(timerInterval);
                    document.getElementById('s22-msg').className = 'result-msg correct';
                    document.getElementById('s22-msg').textContent = '⭕ 성공!';
                    setTimeout(() => {
                        currentIndex += 5;
                        show2_2();
                    }, 1000);
                }
            } else {
                document.getElementById('s22-msg').className = 'result-msg wrong';
                document.getElementById('s22-msg').textContent = '❌ 틀렸습니다!';
                setTimeout(() => {
                    c1.el.classList.remove('selected');
                    c2.el.classList.remove('selected');
                    selectedMatchCards = [];
                    document.getElementById('s22-msg').textContent = '';
                }, 600);
            }
        }
    }

    /* ----------------------------------------------------
       공통 타이머 & 결과 화면
    ---------------------------------------------------- */
    function startTimer(seconds, onTimeout) {
        clearInterval(timerInterval);
        let left = seconds;
        const barId = currentStep === '2-1' ? 's21-timer' : 's22-timer';
        const bar = document.getElementById(barId);
        bar.style.width = '100%';

        timerInterval = setInterval(() => {
            left -= 0.1;
            const pct = (left / seconds) * 100;
            bar.style.width = `${pct}%`;

            if (left <= 0) {
                clearInterval(timerInterval);
                onTimeout();
            }
        }, 100);
    }

    function showStepResult() {
        clearInterval(timerInterval);
        const uniqueWrong = Array.from(new Set(wrongList.map(a => a.word)))
            .map(word => wrongList.find(a => a.word === word));

        if (uniqueWrong.length > 0) {
            showResult(
                `⚠️ 단계 완료 (오답: ${uniqueWrong.length}개)`,
                `틀린 단어가 있습니다! 틀린 단어들로만 재도전해 보세요.`,
                uniqueWrong
            );
        } else {
            showResult(
                "🎉 PERFECT! 완벽합니다!",
                "단 한 문제도 틀리지 않고 모든 단어를 정복하셨습니다!"
            );
        }
    }

    function showResult(title, desc, wrongItems = []) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('screen-result').classList.add('active');

        document.getElementById('res-title').textContent = title;
        document.getElementById('res-desc').textContent = desc;

        const btnDiv = document.getElementById('res-buttons');
        btnDiv.innerHTML = '';

        if (wrongItems.length > 0) {
            const retryBtn = document.createElement('button');
            retryBtn.className = 'action-btn retry';
            retryBtn.textContent = `🔥 틀린 ${wrongItems.length}개 단어 다시 풀기`;
            retryBtn.onclick = () => {
                currentList = wrongItems;
                changeStep(currentStep, true);
            };
            btnDiv.appendChild(retryBtn);
        }

        const nextBtn = document.createElement('button');
        nextBtn.className = 'action-btn';
        nextBtn.style.marginTop = '10px';
        nextBtn.textContent = '🔄 처음부터 다시 도전';
        nextBtn.onclick = () => changeStep(currentStep);
        btnDiv.appendChild(nextBtn);
    }

    changeStep('1-1');
</script>

</body>
